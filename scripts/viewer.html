<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herbier de la Forêt — Visionneuse de Cartes</title>
  <style>
    :root {
      --primary: #1B5E20;
      --primary-light: #2E7D32;
      --bg: #E8F5E9;
      --card-bg: #FFFFFF;
      --text: #212121;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
    }

    p.subtitle {
      color: #555;
      font-size: 0.95rem;
    }

    .scene {
      width: 320px;
      height: 520px;
      perspective: 1000px;
      margin: 10px 0;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      padding: 18px;
      background: var(--card-bg);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 3px solid var(--primary-light);
    }

    /* ── RECTO ─────────────────────────────────────────── */
    .card-front {
      align-items: center;
      text-align: center;
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .card-number {
      background: var(--bg);
      color: var(--primary);
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .image-type-badge {
      font-size: 0.72rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .image-type-badge.fruit  { background: #FFF3E0; color: #E65100; }
    .image-type-badge.feuille { background: #E8F5E9; color: #2E7D32; }
    .image-type-badge.photo  { background: #E3F2FD; color: #1565C0; }

    /* Image recto : fruit ou feuille */
    .front-image-wrap {
      width: 200px;
      height: 210px;
      margin: 10px auto;
      border-radius: 16px;
      overflow: hidden;
      background: #F1F8E9;
      border: 2px solid #A5D6A7;
      flex-shrink: 0;
    }

    .front-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback si image absente */
    .front-image-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
    }

    .tree-title-fr {
      font-size: 1.35rem;
      color: var(--primary);
      font-weight: bold;
      line-height: 1.2;
    }

    .flip-hint {
      font-size: 0.78rem;
      color: #9E9E9E;
      margin-top: 6px;
    }

    /* ── VERSO ─────────────────────────────────────────── */
    .card-back {
      transform: rotateY(180deg);
      background: #FAFAFA;
      border-color: var(--primary);
    }

    .real-photo {
      width: 100%;
      height: 175px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #DDD;
      background-color: #EEE;
      flex-shrink: 0;
    }

    .info-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      overflow: hidden;
    }

    .tree-title-latin {
      font-style: italic;
      font-weight: bold;
      color: #333;
      font-size: 1.05rem;
    }

    /* Geo-location — remplace l'ancien region-badge */
    .geo-badge {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      font-size: 0.8rem;
      color: #455A64;
      line-height: 1.3;
    }

    .geo-badge .geo-icon {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .anecdote {
      font-size: 0.82rem;
      color: var(--primary);
      line-height: 1.35;
      background: #E8F5E9;
      padding: 7px 9px;
      border-radius: 8px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .back-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .onf-tag {
      font-size: 0.72rem;
      font-weight: bold;
      color: var(--primary);
    }

    .img-credit {
      font-size: 0.68rem;
      color: #BDBDBD;
    }

    /* ── Contrôles ─────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button:hover  { background: var(--primary-light); }
    button:active { transform: scale(0.95); }

    button:disabled {
      background: #BDBDBD;
      cursor: not-allowed;
      box-shadow: none;
    }

    .counter {
      font-weight: bold;
      color: var(--primary);
      font-size: 1rem;
      min-width: 80px;
      text-align: center;
    }
  </style>

  <!-- Inclusion directe des données JS sans bloquer le CORS -->
  <script src="treesData.js"></script>
</head>
<body>

  <header>
    <h1>🌲 Herbier de la Forêt</h1>
    <p class="subtitle">Clique sur la carte pour basculer Recto / Verso</p>
  </header>

  <div class="scene">
    <div class="card" id="card" onclick="flipCard()">

      <!-- RECTO : image fruit/feuille + nom français -->
      <div class="card-face card-front">
        <div class="card-top-row">
          <span class="card-number" id="card-id"># 1</span>
          <span class="image-type-badge fruit" id="img-type-badge">fruit</span>
        </div>

        <div class="front-image-wrap">
          <img src="" alt="" class="front-image" id="front-img"
               onerror="this.style.display='none'; document.getElementById('front-fallback').style.display='flex';" />
          <div class="front-image-fallback" id="front-fallback" style="display:none;">🌳</div>
        </div>

        <div>
          <h2 class="tree-title-fr" id="tree-name-fr">Chargement...</h2>
        </div>

        <span class="flip-hint">🔄 Cliquer pour la fiche complète</span>
      </div>

      <!-- VERSO : photo Wikimedia + nom latin + geo + anecdote -->
      <div class="card-face card-back">
        <img src="" alt="Photo de l'arbre" class="real-photo" id="tree-photo"
             onerror="this.style.opacity='0.3';" />

        <div class="info-group">
          <div class="tree-title-latin" id="tree-name-latin">...</div>

          <div class="geo-badge">
            <span class="geo-icon">📍</span>
            <span id="tree-geo">France métropolitaine</span>
          </div>

          <div class="anecdote" id="tree-anecdote">...</div>
        </div>

        <div class="back-footer">
          <span class="onf-tag">🌲 ONF — Agir pour la forêt</span>
          <span class="img-credit" id="img-credit">© Wikimedia Commons</span>
        </div>
      </div>

    </div>
  </div>

  <div class="controls">
    <button id="btn-prev" onclick="navigate(-1)">◄ Précédent</button>
    <span class="counter" id="counter">0 / 0</span>
    <button id="btn-next" onclick="navigate(1)">Suivant ►</button>
  </div>

  <script>
    const trees      = window.TREES_DATA || [];
    let currentIndex = 0;

    // Références DOM
    const card         = document.getElementById('card');
    const cardId       = document.getElementById('card-id');
    const imgTypeBadge = document.getElementById('img-type-badge');
    const frontImg     = document.getElementById('front-img');
    const frontFallback= document.getElementById('front-fallback');
    const treeNameFr   = document.getElementById('tree-name-fr');
    const treeNameLatin= document.getElementById('tree-name-latin');
    const treeGeo      = document.getElementById('tree-geo');
    const treeAnecdote = document.getElementById('tree-anecdote');
    const treePhoto    = document.getElementById('tree-photo');
    const imgCredit    = document.getElementById('img-credit');
    const counter      = document.getElementById('counter');
    const btnPrev      = document.getElementById('btn-prev');
    const btnNext      = document.getElementById('btn-next');

    function flipCard() {
      card.classList.toggle('is-flipped');
    }

    function updateUI() {
      if (!trees || trees.length === 0) {
        treeNameFr.textContent = 'Données introuvables';
        treeNameFr.style.color = 'red';
        return;
      }

      const t = trees[currentIndex];

      // Remettre la carte sur le recto avant la transition
      card.classList.remove('is-flipped');

      setTimeout(() => {
        // ── Recto ─────────────────────────────────────────────────────
        cardId.textContent = `# ${t.id}`;
        treeNameFr.textContent = t.name_fr;

        // Badge de type d'image (fruit / feuille / photo)
        const imgType = t.image_type || 'photo';
        imgTypeBadge.textContent = imgType === 'fruit' ? '🍂 fruit'
                                 : imgType === 'feuille' ? '🍃 feuille'
                                 : '📷 photo';
        imgTypeBadge.className = `image-type-badge ${imgType}`;

        // Image recto (fruit ou feuille depuis ONF/Wikimedia)
        const onfUrl = t.onf_image_url || '';
        if (onfUrl) {
          frontImg.src = onfUrl;
          frontImg.alt = `${imgType === 'fruit' ? 'Fruit' : 'Feuille'} — ${t.name_fr}`;
          frontImg.style.display = 'block';
          frontFallback.style.display = 'none';
        } else {
          frontImg.style.display = 'none';
          frontFallback.style.display = 'flex';
        }

        // ── Verso ──────────────────────────────────────────────────────
        // Photo générale (ancienne image Wikimedia de l'arbre entier)
        treePhoto.src = t.wikimedia_image_url || '';
        treePhoto.alt = `Photo — ${t.name_fr}`;
        treePhoto.style.opacity = '1';

        treeNameLatin.textContent = t.name_latin;

        // Géolocalisation (nouveau champ enrichi)
        const geo = t.geo_location || t.region || 'France métropolitaine';
        treeGeo.textContent = geo;

        treeAnecdote.textContent = `💡 ${t.anecdote}`;

        // Crédit source image
        const srcLabel = { onf: 'ONF', wikimedia: 'Wikimedia Commons', local: 'Wikimedia Commons' };
        imgCredit.textContent = `© ${srcLabel[t.image_source] || 'Wikimedia Commons'}`;

        // Compteur et boutons
        counter.textContent = `${currentIndex + 1} / ${trees.length}`;
        btnPrev.disabled = currentIndex === 0;
        btnNext.disabled = currentIndex === trees.length - 1;
      }, 150);
    }

    function navigate(direction) {
      const next = currentIndex + direction;
      if (next >= 0 && next < trees.length) {
        currentIndex = next;
        updateUI();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'ArrowLeft')  navigate(-1);
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        flipCard();
      }
    });

    // Démarrage
    updateUI();
  </script>
</body>
</html>
